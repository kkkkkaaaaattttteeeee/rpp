services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 3